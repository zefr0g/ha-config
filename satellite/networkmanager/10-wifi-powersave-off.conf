# Deploy to: /etc/NetworkManager/conf.d/10-wifi-powersave-off.conf
#
# Disable WiFi power save on the Pi 4.
#
# The BCM4345 is a combo chip: WiFi and Bluetooth share one 2.4 GHz radio and
# antenna path. brcmfmac enables power save by default (kernel logs
# "brcmf_cfg80211_set_power_mgmt: power save enabled"), and its duty cycling
# steals airtime from the A2DP stream — the mechanism behind Bluetooth audio
# dropouts that leave no local trace (HCI errors 0, PipeWire xruns 0).
# Disabling it buys headroom for the higher-bitrate A2DP codecs
# (see wireplumber/52-bluez-codecs.conf).
#
# A drop-in rather than `nmcli con modify`: the wlan0 connection is generated by
# netplan ("netplan-wlan0-…"), so per-connection settings get regenerated away.
# powersave=2 means "disable" (3 = enable, 0 = use default).
#
# After deploying: nmcli device reapply wlan0 (or reboot). This Pi is
# WiFi-only — no ethernet — so run any reactivation detached from the SSH
# session that issues it.
[connection]
wifi.powersave = 2
