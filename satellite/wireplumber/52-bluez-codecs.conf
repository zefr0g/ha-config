# Deploy to: /etc/wireplumber/wireplumber.conf.d/52-bluez-codecs.conf
#
# A2DP codec policy for Bluetooth speaker mode.
#
# The Pi advertises aptX HD as an A2DP *sink* codec, and a modern phone
# (Pixel 7a) picks it because it is the highest-quality option offered.
# aptX HD is ~576 kbit/s sustained, on the Pi 4's BCM4345 combo chip whose
# 2.4 GHz radio is shared with WiFi — measured 553 kbit/s of ACL traffic with
# HCI errors 0 and PipeWire xruns 0, yet audio drops out periodically: the
# packets simply do not all make it over the air in time.
#
# Plain SBC (~328 kbit/s) fixed the dropouts but audibly costs quality, so the
# sink settles on **standard aptX** (~352 kbit/s): near SBC's airtime, well
# under aptX HD's, and better sounding than SBC at the same bandwidth. sbc is
# kept in the list as the fallback for phones without aptX. SBC-XQ
# (~452 kbit/s) stays disabled — that is the bandwidth problem again, smaller.
#
# Bandwidth ladder, measured on this link (two `hciconfig -a hci0 |
# grep 'RX bytes'` 15 s apart): aptX HD 553 kbit/s = dropouts, SBC 341 kbit/s
# = clean. aptX sits between; if dropouts ever return, drop back to [ sbc ].
#
# After deploying: systemctl --user restart wireplumber, then disconnect and
# reconnect the phone so A2DP renegotiates the codec.
monitor.bluez.properties = {
  bluez5.codecs = [ aptx sbc ]
  bluez5.enable-sbc-xq = false
}
