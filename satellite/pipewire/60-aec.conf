# Acoustic Echo Cancellation for the voice satellite.
#
# Deploy to /etc/pipewire/pipewire.conf.d/60-aec.conf
#
# Why: the INMP441 mic and the MAX98357A amp sit on the same I2S clock, inches
# apart in one enclosure. Without AEC the mic hears the speaker, so the wake
# word cannot be detected while radio or a timer alarm is playing — you have to
# shout over it, or it simply never triggers. webrtc echo-cancel subtracts the
# playback signal from the capture stream, so "Okay Nabu" works during playback.
#
# This creates a virtual source node "aec_mic". LVA must then be pointed at it
# (--audio-input-device aec_mic in /home/dd/lva/docker-compose.yml) — installing
# the module alone changes nothing.
#
# Reference signal: the canceller can only subtract what passes through
# aec_sink. So aec_sink must be the DEFAULT sink — that is what puts Bluetooth
# A2DP music (and LVA's own TTS/radio) into the reference, which is what makes
# "Okay Nabu" work over playback. Set once with:
#   wpctl set-default <aec_sink id>      (WirePlumber persists this)
# Because aec_sink is default, the module's own playback stream must be pinned
# to the real ALSA sink via target.object — otherwise it would connect to the
# default sink, i.e. itself, and loop. target.object is safe here; it routes
# the stream without renaming it (see the node.name warning below).
#
# Do NOT set node.name on capture.props/playback.props. Naming those streams
# after the real ALSA nodes collides with the devices themselves, and the
# canceller ends up nulling the whole capture stream: aec_mic measured
# rms 0.3 / peak 2 (digital silence) against rms 2.7 / peak 34 on the raw mic,
# STT transcribed only "..." and HA answered "je ne peux pas interpréter le
# silence comme une commande". This host has exactly one card, so let PipeWire
# resolve the capture/playback ends itself rather than pinning them.
#
# Post-processing is deliberately ALL OFF (aec.args below). The webrtc plugin
# here supports gain_control, noise_suppression, voice_detection,
# transient_suppression and high_pass_filter, and defaults most of them ON —
# which is tuned for telephony, not for a wake-word model. With them enabled,
# aec_mic measured ~0.5 rms in *every* condition (idle, ambient at 456 rms raw,
# music playing): speech still got through, but everything else was gated flat,
# and microWakeWord never saw a usable "Okay Nabu" over music. AGC in
# particular pumps residual echo back up between words. Leave echo cancellation
# doing the one job it is here for and feed microWakeWord unmangled audio.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      aec.method = webrtc
      aec.args = {
        webrtc.gain_control          = false
        webrtc.noise_suppression     = false
        webrtc.voice_detection       = false
        webrtc.transient_suppression = false
        webrtc.high_pass_filter      = true
      }
      source.props = {
        node.name        = aec_mic
        node.description = "Echo Cancelled Mic"
        node.always-process = true
        session.suspend-timeout-seconds = 0
      }
      sink.props = {
        node.name        = aec_sink
        node.description = "Echo Cancelled Sink"
        node.always-process = true
        session.suspend-timeout-seconds = 0
      }
      capture.props = {
        node.always-process = true
      }
      playback.props = {
        target.object = "alsa_output.platform-soc_sound.stereo-fallback"
        node.always-process = true
      }
    }
  }
]
