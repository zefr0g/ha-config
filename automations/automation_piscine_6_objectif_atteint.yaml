alias: "Piscine 6 — Arrêter pompe quand objectif de filtration atteint"
description: "Coupe la pompe dès que le temps de filtration cible (T°/3, journée 07:00→07:00) est atteint."
trigger:
  - platform: state
    entity_id: sensor.piscine_filtration_jour
  - platform: state
    entity_id: sensor.piscine_filtration_cible
condition:
  - condition: state
    entity_id: switch.piscine_relais
    state: "on"
  - condition: template
    value_template: >
      {% set done = states('sensor.piscine_filtration_jour') | float(0) %}
      {% set cible = states('sensor.piscine_filtration_cible') | float(0) %}
      {{ cible > 0 and done >= cible }}
action:
  - service: switch.turn_off
    target:
      entity_id: switch.piscine_relais
mode: single
