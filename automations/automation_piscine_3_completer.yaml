alias: "Piscine 3 — Compléter filtration en heure creuse"
description: "Démarre la pompe au début des heures creuses après le coucher du soleil si l'objectif de filtration du jour (journée 07:00→07:00) n'est pas atteint."
trigger:
  - platform: state
    entity_id: binary_sensor.heure_creuse
    to: "on"
condition:
  - condition: sun
    after: sunset
  - condition: template
    value_template: >
      {% set done = states('sensor.piscine_filtration_jour') | float(0) %}
      {% set cible = states('sensor.piscine_filtration_cible') | float(0) %}
      {{ cible > 0 and done < cible }}
  - condition: state
    entity_id: switch.piscine_relais
    state: "off"
action:
  - service: switch.turn_on
    target:
      entity_id: switch.piscine_relais
mode: single
